# Сборка обоих профилей, дымовой тест в Renode и HIL-проверки без платы (host.traceability, prepare.*).
# Аппаратные сценарии hw.* выполняются только на стенде разработчика.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  XPACK_VERSION: "14.2.1-1.1"
  XPACK_SHA256: "ed8c7d207a85d00da22b90cf80ab3b0b2c7600509afadf6b7149644e9d4790a6"
  ARM_TOOLCHAIN_ROOT: "/opt/xpack-arm-none-eabi-gcc-14.2.1-1.1"
  RENODE_VERSION: "1.16.1"
  RENODE_SHA256: "00e113cdbd0f5354cf2f64bbe3f5a070d8958409542fca66e45ac97d982938c0"

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: clang-format (src/ only; cmsis/ is vendor code)
        run: clang-format --version && clang-format --dry-run --Werror src/*.cpp src/*.hpp

  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [Debug_F103C8, Release_F103C8, Debug_F103CB, Release_F103CB, HIL_F103C8, HIL_F103CB]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - name: Cache xPack GCC
        id: xpack
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.ARM_TOOLCHAIN_ROOT }}
          key: xpack-arm-none-eabi-gcc-${{ env.XPACK_VERSION }}-linux-x64
      - name: Install xPack GCC (SHA-256 verified)
        if: steps.xpack.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v${XPACK_VERSION}/xpack-arm-none-eabi-gcc-${XPACK_VERSION}-linux-x64.tar.gz"
          curl -fsSL --retry 3 -o /tmp/xpack.tar.gz "$url"
          echo "${XPACK_SHA256}  /tmp/xpack.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/xpack.tar.gz -C /opt
      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Install Renode (SHA-256 verified)
        if: startsWith(matrix.preset, 'Debug_')
        run: |
          url="https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable-dotnet.tar.gz"
          curl -fsSL --retry 3 -o /tmp/renode.tar.gz "$url"
          echo "${RENODE_SHA256}  /tmp/renode.tar.gz" | sha256sum -c -
          sudo mkdir -p /opt/renode && sudo tar -xzf /tmp/renode.tar.gz -C /opt/renode --strip-components=1
          echo "RENODE_BINARY=/opt/renode/renode" >> "$GITHUB_ENV"
      - name: Configure and build
        run: |
          cmake --version
          "${ARM_TOOLCHAIN_ROOT}/bin/arm-none-eabi-gcc" --version | head -1
          cmake --preset "${{ matrix.preset }}"
          cmake --build --preset "${{ matrix.preset }}"
      - name: Renode smoke test without a board
        if: startsWith(matrix.preset, 'Debug_')
        run: ctest --preset "${{ matrix.preset }}-emu"
      - name: HIL checks without a board
        if: startsWith(matrix.preset, 'HIL_')
        run: ctest --preset "${{ matrix.preset }}-host" --output-junit junit-host.xml
      - name: Upload firmware and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/*.elf
            build/${{ matrix.preset }}/*.hex
            build/${{ matrix.preset }}/*.bin
            build/${{ matrix.preset }}/*.map
            build/${{ matrix.preset }}/junit-host.xml
            build/${{ matrix.preset }}/hwtest/runs/
            build/${{ matrix.preset }}/renode/
          if-no-files-found: ignore
