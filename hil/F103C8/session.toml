# Конфигурация прогона HIL для платы F103C8_PC13 (SESSION_CONFIG в cmake/hil.cmake).
# Пути — относительно этого файла.
[config]
target = "target.toml"
api = "../api.toml"

# Файлы данных проекта: t.profile.data["board"].
[data]
board = "board.toml"

# Preserve immutable evidence for each DDTT attempt.
[results]
capture = true

# Проектное описание только регистров, используемых сценариями.
[mmio]
svd = "../common/stm32f103-test.svd"
