# Параметры API и сценариев HIL, общие для обеих плат (stm32-gdbtest, схема 1).
# Сценарии читают раздел [user] через t.profile.get("user.<раздел>.<ключ>").
schema = 1

# Предел обхода кадров frames(): цепочка setup()/loop() -> main() короткая.
[frames]
limit = 8

# Полупериод мигания светодиода (kBlinkHalfPeriodMs в src/app.hpp), мс.
[user.blink]
half_period_ms = 500

# Ожидаемые пределы POST на плате при комнатной температуре и питании 3,3 В
# (уже, чем пределы самой прошивки в src/post.cpp).
[user.post]
vdda_mv = [2900, 3600]
temp_c10 = [-100, 850]

# Отказ POST по питанию: подменённый отсчёт VREFINT даёт VDDA = 1200 * 4095 / 3000 = 1638 мВ,
# ниже нижнего предела прошивки 2000 мВ.
[user.injection]
vrefint_raw = 3000
